<!-- 見つけたフレームの数（脱出ゲーム） -->
<button type="button" class="hunt" id="hunt" aria-controls="mascotPanel" aria-label="隠しフレーム：0／4。ヒントを見る">
  <span class="hunt__slots" aria-hidden="true">
    <svg viewBox="0 0 34 92" data-slot="measure"><use href="#tb-frame"/></svg>
    <svg viewBox="0 0 34 92" data-slot="protect"><use href="#tb-frame"/></svg>
    <svg viewBox="0 0 34 92" data-slot="record"><use href="#tb-frame"/></svg>
    <svg viewBox="0 0 34 92" data-slot="return"><use href="#tb-frame"/></svg>
  </span>
  <span class="hunt__count" id="huntCount">0/4</span>
</button>

<!-- マスコット「とりうる」：押すとヒントと近道が出る -->
<div class="mascot" id="mascot">
  <div class="mascot__panel" id="mascotPanel" role="dialog" aria-modal="false" aria-labelledby="mascotTitle" hidden>
    <p class="mascot__title" id="mascotTitle">とりうるの寄り道案内</p>
    <p class="mascot__hint" id="mascotHint">このページのどこかに、ロゴのフレームが4つ隠れているよ。カーソルを当てると光るものを探してみて！</p>
    <p class="mascot__progress"><span id="mascotCount">0</span>／4 見つけた</p>
    <div class="mascot__links">
      <a href="https://trillion-bank.jp/#diagnose" class="pill pill--blue">無料でAI検索診断</a>
      <a href="#contact" class="pill pill--outline">相談する</a>
    </div>
    <button type="button" class="mascot__close" id="mascotClose" aria-label="案内を閉じる"></button>
  </div>
  <span class="mascot__bubble" id="mascotBubble" aria-hidden="true">押してみて！</span>
  <button type="button" class="mascot__btn" id="mascotBtn" aria-expanded="false" aria-controls="mascotPanel" aria-label="とりうるの寄り道案内を開く">
    <img src="assets/toriuru-point.webp" alt="" width="480" height="480">
  </button>
</div>

<!-- 4つ全部そろったときの隠しシーン -->
<div class="unlock" id="unlock" role="dialog" aria-modal="true" aria-labelledby="unlockTitle" hidden>
  <div class="unlock__inner">
    <svg class="unlock__logo" viewBox="0 0 414 318" aria-hidden="true">
      <g class="unlock__frames" fill="none" stroke="#fff" stroke-width="12">
        <path d="M103 74 L168 42 L168 214 L103 247 Z"/>
        <path d="M183 97 L248 64 L248 236 L183 268 Z"/>
        <path d="M263 108 L327 75 L327 248 L263 281 Z"/>
      </g>
      <path class="unlock__wave" pathLength="1" d="M25 165 H105 C130 165 140 137 166 137 C200 137 216 191 256 191 C286 191 296 165 322 165 H389" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
    </svg>
    <p class="unlock__en">Unlocked</p>
    <h2 class="unlock__title" id="unlockTitle">4つのフレームが、そろいました。</h2>
    <p class="unlock__body">Trillion Bankのロゴは、<b>測る・守る・記録する</b>の3枚のフレームと、そこを通り抜けて発信者へ<b>還る</b>青い線でできています。見つけてくださったあなたの情報も、AIの時代に正しく見つかり、正しく還るように。</p>
    <div class="unlock__actions">
      <a class="pill pill--white pill--lg" href="https://trillion-bank.jp/#diagnose">無料でAI検索診断をはじめる</a>
      <a class="pill pill--outline-white pill--lg" href="#contact" data-close-unlock>Adctorについて相談する</a>
    </div>
    <button type="button" class="unlock__close" id="unlockClose">閉じる</button>
  </div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
</div>

<!-- カーソル（行き先の名前を出す） -->
<div class="cursor" id="cursor" aria-hidden="true"><span class="cursor__label" id="cursorLabel"></span></div>
<!-- ちょっとしたお知らせ -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>
